<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk to Mordor — Advanced</title>
<link rel="icon" href="/icon.png">
<style>
  body { font-family: Georgia, serif; background:#1c1a17; color:#f3e9d2;
    margin:0; padding:24px; max-width:900px; }
  h1 { font-size:22px; margin:0 0 16px; }
  h2 { font-size:16px; margin:24px 0 8px; color:#cbbb96; }
  .card { background:#26231e; border:1px solid #3a352c; border-radius:8px;
    padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; margin:6px 0; font-size:14px; }
  .label { color:#9a8c6d; min-width:140px; }
  .ok { color:#7fc97f; } .warn { color:#e0b060; } .bad { color:#e08080; }
  pre { background:#14120f; border:1px solid #3a352c; border-radius:6px;
    padding:12px; font-size:12px; line-height:1.5; overflow-x:auto;
    max-height:400px; overflow-y:auto; white-space:pre-wrap; }
  a { color:#d4af37; }
  button { background:#4a4234; color:#f3e9d2; border:none; border-radius:6px;
    padding:8px 16px; font-size:14px; cursor:pointer; margin-right:8px; }
  button:hover { filter:brightness(1.15); }
</style>
</head>
<body>
<h1>Walk to Mordor — Advanced</h1>
<p><a href="/">← Back to dashboard</a></p>

<div class="card">
  <h2>Bluetooth (Treadmill)</h2>
  <div id="ble">Loading…</div>
</div>

<div class="card">
  <h2>Daemon</h2>
  <div id="daemon">Loading…</div>
</div>

<div class="card">
  <h2>Encounter Test Mode</h2>
  <p style="font-size:13px;color:#9a8c6d">Force-trigger encounters to stress-test the UI. Open the <a href="/">dashboard</a> in another tab to see them.</p>
  <div>
    <button onclick="loadEncounters()">Refresh list</button>
    <button onclick="resetEncounters()" style="background:#7a2e2e">Reset all</button>
  </div>
  <div id="enc-list" style="margin-top:12px;font-size:13px">Loading…</div>
</div>

<div class="card">
  <h2>Recent Log</h2>
  <div>
    <button onclick="loadLog()">Refresh</button>
    <button onclick="loadLog(200)">Last 200 lines</button>
  </div>
  <pre id="log">Loading…</pre>
</div>

<script>
async function tick() {
  const s = await fetch('/api/stats').then(r => r.json()).catch(() => null);
  if (!s) return;
  const b = s.ble || {};
  const stale = b.last_reading_age_s != null && b.last_reading_age_s > 10;
  const dot = b.connected && !stale ? '<span class="ok">●</span>'
    : (b.connected ? '<span class="warn">●</span>' : '<span class="bad">●</span>');
  const state = b.connected
    ? (stale ? 'Connected, no data' : 'Connected') : 'Disconnected';
  document.getElementById('ble').innerHTML =
    `<div class="row"><span class="label">Status</span>${dot} ${state}</div>` +
    `<div class="row"><span class="label">Device</span>${b.device_name || '—'} ${b.device_address ? '(' + b.device_address + ')' : ''}</div>` +
    `<div class="row"><span class="label">Last reading</span>${b.last_reading_ts || 'none yet'}` +
    (b.last_reading_age_s != null ? ` (${Math.round(b.last_reading_age_s)}s ago)` : '') + `</div>` +
    (b.consecutive_failures ? `<div class="row"><span class="label">Connect failures</span>${b.consecutive_failures}</div>` : '') +
    (b.last_error ? `<div class="row"><span class="label">Last error</span><span class="bad">${b.last_error}</span></div>` : '') +
    `<div class="row"><span class="label">Walking</span>${s.status || (s.walking ? 'yes' : 'no')}</div>`;
  document.getElementById('daemon').innerHTML =
    `<div class="row"><span class="label">Database</span><span style="font-size:12px">${s.db || '—'}</span></div>` +
    `<div class="row"><span class="label">Source</span>${s.source || '—'}</div>`;
}
async function loadLog(n) {
  const d = await fetch('/api/log?n=' + (n || 50)).then(r => r.json()).catch(() => null);
  document.getElementById('log').textContent =
    (d && d.lines.length) ? d.lines.join('\n') : '(empty)';
}
async function loadEncounters() {
  const d = await fetch('/api/encounters/list').then(r => r.json()).catch(() => null);
  const el = document.getElementById('enc-list');
  if (!d || !d.encounters.length) { el.innerHTML = '(no encounters loaded)'; return; }
  el.innerHTML = d.encounters.map(e =>
    `<div class="row"><span class="label">${e.id}</span>` +
    `<span style="color:#9a8c6d">${e.type} · ${e.meeting} · ${e.status}</span> ` +
    `<button onclick="triggerEncounter('${e.id}')" style="padding:4px 12px;font-size:12px">Trigger</button></div>`
  ).join('');
}
async function triggerEncounter(id) {
  await fetch('/api/encounters/trigger', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({encounter_id: id}),
  });
  loadEncounters();
}
async function resetEncounters() {
  if (!confirm('Reset all encounter state?')) return;
  await fetch('/api/encounters/reset', {method: 'POST'});
  loadEncounters();
}
tick(); setInterval(tick, 5000);
loadLog();
loadEncounters();
</script>
</body>
</html>
