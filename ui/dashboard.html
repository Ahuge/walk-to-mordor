<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk to Mordor</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/leaflet.css">
<style>
  :root { --parchment:#f3e9d2; --ink:#3a2e1e; --bg:#1c1a17; --card:#2a251d; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:#e8dcc0; font-family:Georgia,'Times New Roman',serif; margin:0; padding:16px; }
  header { text-align:center; margin-bottom:12px; }
  header h1 { margin:0; letter-spacing:4px; font-size:28px; color:var(--parchment); }
  header p { margin:4px 0 0; color:#9a8c6d; font-style:italic; font-size:14px; }
  main { display:flex; gap:16px; max-width:1500px; margin:0 auto; align-items:flex-start; }
  #map-card { flex:3; background:var(--card); border-radius:12px; padding:12px; min-width:0; }
  #map-wrap { position:relative; }
  #map { height:72vh; min-height:480px; border-radius:8px; background:#e8d9b8; }
  .map-btns { position:absolute; top:12px; left:12px; z-index:500; display:flex; flex-direction:column; gap:6px; }
  .map-btns button { width:36px; height:36px; padding:0; font-size:18px; border-radius:8px;
    background:var(--parchment); color:var(--ink); border:none; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .tok { width:24px; height:24px; border-radius:50%; background:#1f3a6e; border:3px solid #f5edd8;
    box-shadow:0 0 0 2px #1f3a6e, 0 2px 8px rgba(0,0,0,.5); }
  .star { font-size:19px; line-height:22px; text-align:center; color:#8a6d1f; opacity:.8;
    text-shadow:0 0 4px #f5edd8, 0 0 8px #f5edd8; }
  .star.target { color:#c99612; opacity:1; font-size:25px; animation:starpulse 2s infinite; }
  .star.done { color:#6b5a24; opacity:.45; }
  @keyframes starpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  .leaflet-control-layers { background:#2a251d; border:none; border-radius:8px;
    font-family:Georgia,serif; color:#e8dcc0; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .leaflet-control-layers label { color:#e8dcc0; }
  .leaflet-popup-content-wrapper { background:#f3e9d2; color:#3a2e1e; font-family:Georgia,serif; }
  .leaflet-popup-content { max-width:260px; }
  aside { flex:1; min-width:280px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; }
  .card h2 { margin:0 0 8px; font-size:15px; letter-spacing:2px; color:var(--parchment); text-transform:uppercase; }
  #status-line { font-size:18px; font-style:italic; }
  #leg-line { font-size:14px; margin-top:6px; }
  .bar { height:10px; background:#141210; border-radius:5px; margin-top:8px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,#7da05c,#d4af37); width:0%; transition:width 1s; }
  #dist-line { margin-top:8px; font-size:14px; color:#cbbb96; }
  .btnrow { display:flex; gap:8px; margin-top:4px; }
  .btnrow button { flex:1; font-family:inherit; font-size:15px; padding:10px 0; border:none; border-radius:8px;
           background:var(--parchment); color:var(--ink); cursor:pointer; }
  .btnrow button:hover { filter:brightness(1.08); }
  .btnrow button.danger { background:#8c3b2e; color:#f3e9d2; }
  #march-log { list-style:none; margin:0; padding:0; font-size:13px; max-height:220px; overflow-y:auto; }
  #march-log li { padding:6px 0; border-bottom:1px solid #3a332a; color:#cbbb96; }
  #march-log li:last-child { border-bottom:none; }
  #leg-detail { margin-top:8px; font-size:13px; color:#cbbb96; }
  #steps-today { font-size:18px; font-style:italic; }
  #steps-graph { display:flex; align-items:stretch; gap:4px; height:108px; margin-top:8px; }
  #steps-graph .bar-col { flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-end; gap:3px; min-width:0; }
  #steps-graph .bar { width:100%; max-width:22px; border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,#8a7a4a,#5c6e3f); }
  #steps-graph .bar-col.today .bar { background:linear-gradient(180deg,#f5d76e,#d4af37);
    box-shadow:0 0 6px rgba(212,175,55,.6); }
  #steps-graph .lbl { font-size:9px; color:#9a8c6d; }
  body.widget #steps-card { display:none; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px);
    background:#8c3b2e; color:#f3e9d2; padding:10px 16px; border-radius:8px; font-size:14px;
    opacity:0; pointer-events:none; transition:all .25s; z-index:2000; max-width:90vw; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #errbanner { display:none; background:#8c3b2e; color:#f3e9d2; padding:10px 16px;
    font-size:14px; text-align:center; }
  footer { text-align:center; color:#9a8c6d; font-size:12px; margin-top:14px; font-style:italic; }
  #mini-status { display:none; }

  /* ---- widget mode (~300x275): narrow viewport or ?widget=1 ----
     Minimap on top (zoomable), compact [Start][Stop][−][+] row below.
     Uses explicit viewport heights (not a flex height chain) so the map
     always gets a definite size. */
  body.widget { padding:0; }
  body.widget header, body.widget footer { display:none; }
  body.widget main { display:block; max-width:none; margin:0; padding:0; }
  body.widget #map-card { padding:0; border-radius:0; }
  body.widget #map-wrap { position:relative; }
  body.widget #map { height:calc(100vh - 62px); min-height:0; border-radius:0; }
  body.widget aside { min-width:0; }
  body.widget #journey-card, body.widget #march-card { display:none; }
  body.widget #belt-card { border-radius:0; padding:6px; height:62px; box-sizing:border-box;
    display:flex; gap:6px; }
  body.widget #belt-card h2 { display:none; }
  body.widget #belt-card .btnrow { flex:1 1 0; display:flex; gap:6px; margin-top:0; min-width:0; }
  body.widget #belt-card .btnrow button { flex:1 1 0; min-width:0; padding:2px 0;
    font-size:11px; margin-top:0; }
  body.widget #btnrow-main { display:none; }
  #btn-toggle { display:none; }
  body.widget #btn-toggle { display:block; }
  body.widget .wide-only { display:none; }
  body.widget .map-btns { top:8px; left:8px; }
  body.widget .map-btns button { width:30px; height:30px; font-size:15px; }
  body.widget #mini-status { display:block; position:absolute; left:46px; bottom:8px; z-index:500;
    background:rgba(28,26,23,.85); color:#f3e9d2; font-size:12px; padding:4px 8px;
    border-radius:6px; font-style:italic; pointer-events:none; max-width:calc(100% - 60px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<header>
  <h1>WALK TO MORDOR</h1>
  <p>every step is a mile on the road</p>
</header>
<main>
  <div id="map-card">
    <div id="map-wrap">
      <div id="map"></div>
      <div id="mini-status"></div>
      <div class="map-btns">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">−</button>
        <button id="zloc" title="Jump to token">⌖</button>
      </div>
    </div>
  </div>

  <aside>
    <div class="card" id="journey-card">
      <h2>Journey</h2>
      <div id="status-line">…</div>
      <div id="leg-line">…</div>
      <div class="bar"><div id="leg-bar"></div></div>
      <div id="leg-detail">…</div>
      <div id="dist-line">…</div>
    </div>
    <div class="card" id="belt-card">
      <h2>Belt</h2>
      <div class="btnrow" id="btnrow-main">
        <button id="btn-start">Start</button>
        <button id="btn-stop" class="danger">Stop</button>
      </div>
      <div class="btnrow">
        <button id="btn-toggle">▶</button>
        <button id="btn-slower">−<span class="wide-only"> speed</span></button>
        <button id="btn-faster">+<span class="wide-only"> speed</span></button>
      </div>
    </div>
    <div class="card" id="march-card">
      <h2>March log</h2>
      <ul id="march-log"><li>…</li></ul>
    </div>
    <div class="card" id="steps-card">
      <h2>Steps</h2>
      <div id="steps-today">…</div>
      <div id="steps-graph"></div>
    </div>
  </aside>
</main>
<footer>Map: Yohann Bethoule / middleearthmap.app (base map by lotrproject.com) — used with permission.</footer>
<div id="toast"></div>

<script src="/leaflet.js"></script>
<script>
const YTOP = 4334;
let map, journey, cumPx, totalPx, token, fogLayers, fogHalos, lastPos = null, lastSpeed = 0;
let routeLegs = [], lastTodaySteps = 0, followToken = false, widgetInit = false;

function fmtEta(h) {
  if (!isFinite(h) || h < 0) return '—';
  if (h < 1.5) return `${Math.round(h * 60)} min`;
  return `${h < 10 ? h.toFixed(1) : Math.round(h)} h`;
}

// Widget mode: narrow viewport (e.g. a 300x275 window) or ?widget=1 —
// minimap on top, compact control row below.
const widgetMQ = window.matchMedia('(max-width: 460px)');
function applyWidgetMode() {
  const on = widgetMQ.matches || new URLSearchParams(location.search).has('widget');
  document.body.classList.toggle('widget', on);
  // Belt: widget mode uses the single ▶/⏹ toggle, not Start/Stop.
  const main = document.getElementById('btnrow-main');
  if (main) main.style.display = on ? 'none' : '';
  if (map) setTimeout(() => map.invalidateSize(), 60);
}
widgetMQ.addEventListener('change', applyWidgetMode);
let _rsz;
window.addEventListener('resize', () => { clearTimeout(_rsz); _rsz = setTimeout(() => { if (map) map.invalidateSize(); }, 200); });

function pointAt(d) {
  d = Math.max(0, Math.min(totalPx, d));
  let lo = 0, hi = cumPx.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cumPx[mid] < d) lo = mid + 1; else hi = mid; }
  const i = Math.max(1, lo);
  const d0 = cumPx[i-1], d1 = cumPx[i];
  const t = d1 > d0 ? (d - d0) / (d1 - d0) : 0;
  const a = journey.path[i-1], b = journey.path[i];
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];  // [lat, lng]
}

async function init() {
  try {
    await initInner();
  } catch (e) {
    showError('Dashboard failed to start: ' + (e && e.message || e) +
              ' — open F12 console for details.');
    throw e;
  }
}

function showError(msg) {
  let b = document.getElementById('errbanner');
  if (!b) {
    b = document.createElement('div');
    b.id = 'errbanner';
    document.body.prepend(b);
  }
  b.textContent = msg;
  b.style.display = 'block';
}

async function initInner() {
  if (!window.L) throw new Error('Leaflet failed to load (/leaflet.js unreachable)');
  const jr = await fetch('/journey.json');
  if (!jr.ok) throw new Error('/journey.json → HTTP ' + jr.status);
  journey = await jr.json();
  if (!journey.path || !journey.path.length) throw new Error('/journey.json has no path');
  cumPx = journey.cumPx; totalPx = journey.totalPx;

  map = L.map('map', {crs: L.CRS.Simple, zoomControl: false,
                      minZoom: -3, maxZoom: 2, attributionControl: false});
  const bounds = [[0, 0], [YTOP, 5000]];
  const img = L.imageOverlay(journey.image, bounds);
  img.on('error', () => showError('Map image failed to load (' + journey.image + ')'));
  img.addTo(map);
  map.fitBounds(bounds);

  L.polyline(journey.path, {color: '#f5edd8', weight: 9, opacity: 0.9}).addTo(map);
  L.polyline(journey.path, {color: '#b3401e', weight: 4.5, opacity: 0.95}).addTo(map);

  // fog of war: dark overlay with a soft corridor cut along the visited
  // path, plus a visibility halo around the token. Layered strokes fake
  // the soft edge cheaply (no blur filters to re-render every tick).
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 5000 4344');
  const fogStroke = (id, w, op) =>
    `<polyline id="${id}" points="" fill="none" stroke="black" stroke-width="${w}" ` +
    `stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
  svg.innerHTML =
    '<defs><mask id="fogmask"><rect x="0" y="0" width="5000" height="4344" fill="white"/>' +
    fogStroke('fog1', 950, 0.45) + fogStroke('fog2', 680, 0.75) + fogStroke('fog3', 440, 1) +
    '<circle id="halo1" r="480" fill="black" opacity="0.5"/>' +
    '<circle id="halo2" r="300" fill="black" opacity="1"/>' +
    '</mask></defs>' +
    '<rect x="0" y="0" width="5000" height="4344" fill="#0b0b16" opacity="0.74" mask="url(#fogmask)"/>';
  L.svgOverlay(svg, bounds).addTo(map);
  fogLayers = [svg.querySelector('#fog1'), svg.querySelector('#fog2'),
               svg.querySelector('#fog3')];
  fogHalos = [svg.querySelector('#halo1'), svg.querySelector('#halo2')];

  token = L.marker(journey.path[0], {interactive: false, icon: L.divIcon(
    {className: '', html: '<div class="tok"></div>', iconSize: [24,24], iconAnchor: [12,12]})
  }).addTo(map);

  // leg milestone stars at each leg's destination
  try {
    const route = await fetch('/api/route').then(r => r.json());
    routeLegs = route.legs || [];
    const totalMi = routeLegs.reduce((a, l) => a + l.distance, 0);
    let cum = 0;
    routeLegs.forEach((leg, idx) => {
      cum += leg.distance;
      const m = L.marker(pointAt(cum / totalMi * totalPx), {
        icon: L.divIcon({className: '', html: `<div class="star" data-i="${idx}">★</div>`,
                         iconSize: [22, 22], iconAnchor: [11, 11]}),
        title: leg.name,
      });
      m.bindTooltip(`<b>${leg.name}</b><br>${leg.from} → ${leg.to}<br>${(leg.distance * 1.60934).toFixed(0)} km`);
      m.addTo(map);
    });
  } catch (e) { /* milestones optional */ }

  addOverlays();

  document.getElementById('zin').onclick = () => map.zoomIn();
  document.getElementById('zout').onclick = () => map.zoomOut();
  document.getElementById('zloc').onclick = () => {
    if (lastPos) { map.panTo(lastPos); followToken = true; }
  };
  // In widget mode the map follows the token; grabbing the map pauses
  // following until ⌖ is tapped.
  map.on('dragstart', () => { followToken = false; });

  applyWidgetMode();

  tick(); setInterval(tick, 2000);
  loadMarches(); setInterval(loadMarches, 10000);
}

const OVERLAY_ICONS = { encounter: '/icons/eye.svg', battle: '/icons/swords.svg', death: '/icons/coffin.svg' };

// Event overlays from the Middle-earth map data (toggleable layers).
async function addOverlays() {
  const markers = await fetch('/markers.json').then(r => r.json()).catch(() => []);
  const groups = { 'Encounters': L.layerGroup(), 'Deaths': L.layerGroup() };
  for (const m of markers) {
    const ev = (m.tags && m.tags.events) || [];
    let g = null, kind = null;
    if (ev.includes('encounter')) { g = 'Encounters'; kind = 'encounter'; }
    else if (ev.includes('death')) { g = 'Deaths'; kind = 'death'; }
    if (!g) continue;
    const marker = L.marker([YTOP - m.y, m.x], {
      icon: L.icon({ iconUrl: OVERLAY_ICONS[kind], iconSize: [26, 26],
                     iconAnchor: [13, 26], popupAnchor: [0, -24] }),
      title: m.title,
    });
    const link = m.infoLink ? `<br><a href="${m.infoLink}" target="_blank" rel="noopener">Learn more</a>` : '';
    marker.bindPopup(`<b>${m.title}</b><br>${m.description || ''}${link}`);
    groups[g].addLayer(marker);
  }
  for (const [name, g] of Object.entries(groups)) g.addTo(map);
  L.control.layers(null, groups, { collapsed: false }).addTo(map);
}

async function tick() {
  const s = await fetch('/api/stats').then(r => r.json()).catch(() => null);
  if (!s || s.error || typeof s.journey_frac !== 'number') return;
  lastSpeed = s.speed_kmh || 0;
  const pos = pointAt(s.journey_frac * totalPx);
  const moved = !lastPos || !pos.equals(lastPos);
  lastPos = pos;
  token.setLatLng(pos);
  if (document.body.classList.contains('widget') && pos) {
    if (!widgetInit) {
      // Launch: center on the player once.
      map.setView(pos, Math.max(map.getZoom(), 0));
      widgetInit = true;
      followToken = true;
    } else if (followToken && moved) {
      // Player moved: follow. Otherwise leave the view alone so the
      // user can pan/zoom freely.
      map.panTo(pos);
    }
  }

  // fog: corridor along the visited portion of the path (image px coords),
  // plus a halo around the token so the nearby area is always readable
  const target = s.journey_frac * totalPx;
  let pts = '';
  for (let i = 0; i < cumPx.length && cumPx[i] <= target; i += 4) {
    const p = journey.path[i];
    pts += `${p[1].toFixed(0)},${(YTOP - p[0]).toFixed(0)} `;
  }
  const px = pos[1].toFixed(0), py = (YTOP - pos[0]).toFixed(0);
  pts += `${px},${py}`;
  for (const layer of fogLayers) layer.setAttribute('points', pts);
  for (const halo of fogHalos) { halo.setAttribute('cx', px); halo.setAttribute('cy', py); }

  document.getElementById('status-line').textContent =
    s.walking ? `Walking @ ${s.speed_kmh.toFixed(1)} km/h` : 'At rest';
  document.getElementById('leg-line').textContent =
    `Leg ${s.leg_index + 1}/${s.leg_count} — ${s.leg_name}`;
  document.getElementById('leg-bar').style.width = `${(s.leg_frac * 100).toFixed(0)}%`;
  document.querySelectorAll('.star').forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle('target', i === s.leg_index);
    el.classList.toggle('done', i < s.leg_index);
  });
  const leg = routeLegs[s.leg_index];
  if (leg) {
    const legKm = leg.distance * 1.60934;
    const remainKm = Math.max(0, (1 - s.leg_frac) * legKm);
    const pace = s.pace_kmh || 2.5;
    document.getElementById('leg-detail').textContent =
      `${legKm.toFixed(0)} km leg · ${remainKm.toFixed(1)} km to ${leg.to} · ` +
      `≈ ${fmtEta(remainKm / pace)} at ${pace.toFixed(1)} km/h`;
  }
  if (typeof s.today_steps === 'number') {
    lastTodaySteps = s.today_steps;
    document.getElementById('steps-today').textContent =
      `${s.today_steps.toLocaleString()} steps today`;
  }
  const streak = s.streak ? ` · 🔥 ${s.streak}-day streak` : '';
  document.getElementById('dist-line').textContent =
    `Today ${s.today_km.toFixed(1)} km · Total ${s.total_km.toFixed(1)} km${streak}`;
  const ms = document.getElementById('mini-status');
  if (ms) ms.textContent =
    `${s.walking ? `Walking ${s.speed_kmh.toFixed(1)} km/h` : 'At rest'} · ` +
    `Leg ${s.leg_index + 1}/${s.leg_count} · ${s.today_km.toFixed(1)} km today`;
  lastWalking = !!s.walking;
  const tg = document.getElementById('btn-toggle');
  if (tg && !tg.dataset.armed) tg.textContent = s.walking ? '⏹' : '▶';
  // Clear a stale arm if the belt started by other means.
  if (tg && tg.dataset.armed && s.walking) {
    delete tg.dataset.armed;
    tg.style.background = '';
  }
}

async function loadMarches() {
  const data = await fetch('/api/marches?limit=500').then(r => r.json()).catch(() => null);
  if (!data) return;
  const marches = data.marches;
  const ul = document.getElementById('march-log');
  ul.innerHTML = marches.length ? '' : '<li>No marches yet — walk!</li>';
  for (const m of marches.slice(0, 8)) {
    const d = new Date(m.started_at);
    const mins = Math.round(m.duration_s / 60);
    const li = document.createElement('li');
    li.textContent = `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}` +
      ` — ${(m.distance_m/1000).toFixed(1)} km in ${mins} min` +
      (m.avg_speed_kmh ? ` @ ${m.avg_speed_kmh.toFixed(1)} km/h` : '') +
      (m.steps ? ` · ${m.steps.toLocaleString()} steps` : '');
    ul.appendChild(li);
  }
  renderStepsGraph(marches);
}

function dayKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderStepsGraph(marches) {
  const el = document.getElementById('steps-graph');
  if (!el) return;
  const now = new Date();
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    days.push({ key: dayKey(d), label: d.toLocaleDateString([], { weekday: 'narrow' }),
                steps: 0, today: i === 0 });
  }
  const byKey = Object.fromEntries(days.map(d => [d.key, d]));
  for (const m of marches) {
    const day = byKey[dayKey(new Date(m.started_at))];
    if (day && m.steps) day.steps += m.steps;
  }
  const today = days[days.length - 1];
  today.steps = Math.max(today.steps, lastTodaySteps);
  const max = Math.max(1, ...days.map(d => d.steps));
  el.innerHTML = '';
  for (const d of days) {
    const col = document.createElement('div');
    col.className = 'bar-col' + (d.today ? ' today' : '');
    col.title = `${d.steps.toLocaleString()} steps`;
    col.innerHTML = `<div class="bar" style="height:${Math.max(2, Math.round(d.steps / max * 80))}px"></div>` +
                    `<div class="lbl">${d.label}</div>`;
    el.appendChild(col);
  }
}

async function cmd(op, args = {}) {
  try {
    const r = await fetch('/api/commands', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({op, args}),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { toast(`Belt command failed: ${data.error || r.status}`); return null; }
    return data;
  } catch (e) {
    toast('Belt command failed: no connection to daemon');
    return null;
  }
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 3500);
}
// −/+ while walking adjusts speed live. At rest the pad takes no targets,
// so offer to start the belt at the new speed instead of silently queuing.
function inlineConfirm(btn, label, action) {
  // Two-step inline confirm for the widget (native confirm() is too wide).
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    btn.style.background = '';
    clearTimeout(btn._armTimer);
    if (btn._origText) btn.textContent = btn._origText;
    action();
  } else {
    btn.dataset.armed = '1';
    btn.style.background = '#8c3b2e';
    btn._origText = btn.textContent;
    btn.textContent = label;
    btn._armTimer = setTimeout(() => {
      delete btn.dataset.armed;
      btn.style.background = '';
      if (btn._origText) btn.textContent = btn._origText;
    }, 3000);
  }
}
function nudge(delta) {
  const base = lastSpeed > 0.05 ? lastSpeed : 2.0;
  const kmh = Math.max(0.5, Math.round((base + delta) * 2) / 2);
  if (lastSpeed > 0.05) {
    cmd('set_speed', {kmh});
  } else if (document.body.classList.contains('widget')) {
    const btn = document.getElementById(delta > 0 ? 'btn-faster' : 'btn-slower');
    inlineConfirm(btn, `Start ${kmh.toFixed(1)}?`, () => {
      (async () => { if (await cmd('set_speed', {kmh})) await cmd('start'); })();
    });
  } else if (confirm(`Start the belt at ${kmh.toFixed(1)} km/h? Area clear, safety key in?`)) {
    (async () => { if (await cmd('set_speed', {kmh})) await cmd('start'); })();
  }
}
document.getElementById('btn-start').onclick = () => {
  if (confirm('Belt will start shortly. Area clear, safety key in?')) cmd('start');
};
document.getElementById('btn-stop').onclick = () => cmd('stop');
document.getElementById('btn-slower').onclick = () => nudge(-0.5);
document.getElementById('btn-faster').onclick = () => nudge(0.5);
let lastWalking = false;
document.getElementById('btn-toggle').onclick = () => {
  const tg = document.getElementById('btn-toggle');
  if (lastWalking) { cmd('stop'); return; }
  inlineConfirm(tg, 'Sure?', () => cmd('start'));
};

init();
</script>
